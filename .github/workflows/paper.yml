name: paper
on:
  schedule:
    - cron: "3,33 13-20 * * 1-5"   # Nasdaq checks (script uses New York time itself)
    - cron: "57 19,20 * * 1-5"     # 15:55 NY flat (summer / winter)
    - cron: "15 0 * * *"           # crypto trend + Hyperliquid carry, daily
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: paper, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy requests
      - run: |
          python paper.py daily      # runs every time; does work only once per UTC day (GitHub crons can be hours late)
          python paper.py intraday
      - run: |
          git config user.name "paper-bot"; git config user.email "124206442+Kalanda14@users.noreply.github.com"
          git add paper/ && git commit -m "paper: $(date -u +%F_%H%M)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 10 + 5)); done; exit 1
